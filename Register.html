<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3 class="text-center">تۆمارکردن</h3>
        </div>
        <div class="card-body">
          <!-- Registration Form -->
          <form>
            <div class="form-group">
              <label for="username">ناوی بەکارهێنەر</label><br>
              <input type="text" class="form-control" id="username" placeholder="ناوی بەکارهێنەر">
            </div><br>
            <div class="form-group">
              <label for="email">ئیمەیڵ</label><br>
              <input type="email" class="form-control" id="email" placeholder="ئیمەیڵ">
            </div><br>
            <div class="form-group">
              <label for="password">وشەی تێپەڕ</label><br>
              <input type="password" class="form-control" id="password" placeholder="وشەی تێپەڕ">
            </div><br>
            <div class="form-group">
              <label for="confirmPassword">دڵنیایوون لە وشەی تێپەڕ</label><br>
              <input type="password" class="form-control" id="confirmPassword" placeholder="دڵنیایوون لە وشەی تێپەڕ">
            </div><br>
            <button type="submit"  class="btn btn-outline-primary  btn-lg btn-block">تۆمارکردن</button>
          </form>

          <!-- End Registration Form -->
        </div>
      </div>
    </div>
  </div>
</div><br><br><br><br>
